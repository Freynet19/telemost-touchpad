name: release

# Publishes a GitHub Release with the installable zip when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the installable package
        shell: pwsh
        run: ./build.ps1 -Zip

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          Copy-Item dist.zip "telemost-touchpad-$env:TAG.zip"
          gh release create $env:TAG "telemost-touchpad-$env:TAG.zip" --title $env:TAG --generate-notes
